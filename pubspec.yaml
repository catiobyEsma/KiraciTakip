name: kiraci_takip
description: "Kiracı Ödeme Takip Sistemi - Masaüstü Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Masaüstü için yerel SQLite veritabanı
  sqflite_common_ffi: ^2.3.3

  # Dosya sistemi yolları (veritabanı ve dekont fotoğrafları için)
  path_provider: ^2.1.3
  path: ^1.9.0

  # Dekont (fotoğraf/PDF) seçmek için dosya seçici
  file_picker: ^8.1.2

  # Tarih formatlama (tr_TR)
  intl: ^0.19.0

  # Takvim bileşeni
  table_calendar: ^3.1.2

  # Sayıları binlik ayraçlı para birimi olarak göstermek için
  # (intl paketi NumberFormat ile zaten karşılıyor, ek pakete gerek yok)

  # Basit durum yönetimi
  provider: ^6.1.2

  # Dosyayı sistemde varsayılan uygulamayla açmak için (dekont görüntüleme)
  open_filex: ^4.5.0
  sqflite: ^2.4.4
  permission_handler: ^12.0.1
  device_info_plus: ^12.4.0

  # Uygulama içi bildirimler / snackbar yardımcıları zaten Flutter'da var

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/KiraTakip Finance Logo-2.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#C4C4C4"
  adaptive_icon_foreground: "assets/KiraTakip Finance Logo-2.png"
  adaptive_icon_foreground_inset: 16
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256

flutter:
  uses-material-design: true
